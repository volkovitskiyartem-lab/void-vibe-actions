name: DJ Brain RC38 adaptive mixing offline CI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dj-rc38-ci.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: void-vibe-dj-rc38-offline
  cancel-in-progress: false

jobs:
  fixed-pair-adaptive-unit-tests:
    if: github.repository == 'volkovitskiyartem-lab/void-vibe-actions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout pinned private RC38 code (no Telegram)
        uses: actions/checkout@v4
        with:
          repository: volkovitskiyartem-lab/void-vibe-router
          ref: 3b1eaff46110f795a26902fe08192463839cbca5
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: app
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test adaptive transitions on synthetic audio and source manifest
        working-directory: app
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libsndfile1
          python -m pip install -r requirements.txt -r requirements-dj.txt
          python -m compileall -q dj_rc38_adaptive.py dj_rc38_experiment.py dj_rc38_learning.py test_dj_rc38.py dj_rc33_pair_lab.py
          python -m unittest -v test_djbrain_runner_ledger test_djbrain_runner_execute test_djbrain_runner_package test_dj_rc38
          python -m djbrain_runner.execute --selftest
          python dj_rc38_adaptive.py
          python dj_rc38_learning.py
          python dj_rc38_experiment.py --selftest
          echo 'RC38 source pairs were not filtered; synthetic audio tests completed. No Telegram access or real music.'

  trusted-allowlist-offline-check:
    if: github.repository == 'volkovitskiyartem-lab/void-vibe-actions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout PUBLIC trusted runner resolver
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Python for resolver tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact experiment allowlist and shell injection rejection
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_djbrain_resolve
          python - <<'PY'
          from pathlib import Path
          from djbrain_runner.resolve import resolve_experiment
          result=resolve_experiment('rc38-fixed',Path('djbrain_runner/approved_experiments.json'))
          assert result['repository']=='volkovitskiyartem-lab/void-vibe-router'
          assert len(result['commit_sha'])==40
          print('PUBLIC resolver passed strict immutability checks. No Telegram access.')
          PY
