name: Verify Fresh Music daily and bulk isolation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fresh-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: github.ref == 'refs/heads/main' && vars.PUBLIC_RUNNER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: volkovitskiyartem-lab/void-vibe-router
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test third-source daily cutover, archive isolation and quota
        env:
          ROUTER_STATE_DIR: ${{ runner.temp }}/fresh-test-state
        run: |
          python -m pip install -r requirements.txt
          python -m unittest -v test_fresh_daily test_fresh_bulk test_incremental_sync test_drip_queue
      - name: Inspect only classification outcomes from saved private state
        run: |
          set -euo pipefail
          git fetch origin 'refs/heads/router-state:refs/remotes/origin/router-state'
          git show origin/router-state:data/router.sqlite3 > /tmp/fresh-qa-state.sqlite3
          python - <<'PY'
          import sqlite3
          with sqlite3.connect('/tmp/fresh-qa-state.sqlite3') as db:
              print('Fresh queue status:')
              for row in db.execute('SELECT status,count(*) FROM fresh_bulk_queue GROUP BY status'):
                  print(row)
              print('Fresh review reason counts:')
              for row in db.execute('SELECT reason,count(*) FROM fresh_bulk_queue WHERE status=? GROUP BY reason ORDER BY count(*) DESC',('review',)):
                  print(row)
          PY
