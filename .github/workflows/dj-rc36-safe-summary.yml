# Read existing private draft release only. No Telegram, no audio publication.
name: DJ Brain RC36 — private report aggregate (no audio)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dj-rc36-safe-summary.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-vibe-rc36-readonly-summary
  cancel-in-progress: false

jobs:
  review-safe-counts:
    if: github.ref == 'refs/heads/main' && github.repository == 'volkovitskiyartem-lab/void-vibe-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download EXISTING private RC36 draft report, no Telegram access
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "Missing private-repo read access"; exit 1; }
          mkdir -p input
          gh release download "djbrain-rc36-private-38904713419" \
            --repo volkovitskiyartem-lab/void-vibe-router \
            --pattern "djbrain-rc36-private-38904713419.tar.gz" \
            --dir input
      - name: Print aggregate-only QC results (no titles, IDs or audio)
        run: |
          python - <<'PY'
          import json, tarfile, pathlib
          p=pathlib.Path("input/djbrain-rc36-private-38904713419.tar.gz")
          with tarfile.open(p,"r:gz") as tf:
              reports=[x for x in tf.getmembers() if x.name.lstrip("./")=="RC36_RESULTS.json"]
              if len(reports)!=1: raise SystemExit("Private report missing or duplicated")
              info=json.load(tf.extractfile(reports[0]))
              mp3_in_archive=sum(x.name.lower().endswith(".mp3") and x.isfile() for x in tf.getmembers())
          for name in ("attempted_pairs","distinct_pairs","pairs_with_technical_previews",
                       "pairs_blocked_or_failed","total_real_mp3_previews"):
              assert isinstance(info[name],int)
          assert info["attempted_pairs"]==9
          assert info["pairs_with_technical_previews"]+info["pairs_blocked_or_failed"]==9
          print("RC36 aggregate-only technical results — no audio or music metadata exposed")
          for k in ("attempted_pairs","distinct_pairs","duplicate_pairs",
                    "pairs_with_technical_previews","pairs_blocked_or_failed",
                    "total_real_mp3_previews"):
              print(k+":",info[k])
          print("MP3 files in PRIVATE archive:",mp3_in_archive)
          for genre,stats in sorted(info["by_genre"].items()):
              print(genre, "attempted",stats["attempted"],
                    "accepted",stats["technical_pass_pairs"],
                    "previews",stats["mp3_count"])
          print("Musical quality remains unverified until listener feedback.")
          PY

      - name: Download already-generated private RC37 archive read-only, without Telegram
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh release download "djbrain-rc37-private-38954223934" \
            --repo volkovitskiyartem-lab/void-vibe-router \
            --pattern "djbrain-rc37-private-38954223934.tar.gz" \
            --dir input

      - name: RC37 aggregate-only review, no titles or Telegram IDs
        run: |
          python - <<'PY'
          import json, pathlib, tarfile
          path=pathlib.Path("input/djbrain-rc37-private-38954223934.tar.gz")
          with tarfile.open(path, "r:gz") as archive:
              matches=[x for x in archive.getmembers() if x.name.lstrip("./")=="RC37_RESULTS.json"]
              if len(matches)!=1: raise SystemExit("Missing/duplicate RC37 report")
              report=json.load(archive.extractfile(matches[0]))
              actual_mp3=sum(x.isfile() and x.name.endswith(".mp3") for x in archive.getmembers())
          assert report.get("version")=="RC37"
          assert report["attempted_pairs"]==9
          assert report["comparison_mode"]=="fixed"
          assert len(report["pair_attempts"])==9
          assert report["pairs_with_technical_previews"]+report["pairs_blocked_or_failed"]==9
          assert report["total_real_mp3_previews"]==actual_mp3
          assert all(x.get("manual_listening_required") is True
              for row in report["pair_attempts"] for x in row["technical_previews"])
          print("RC37 aggregate-only review; private audio, titles and IDs not exposed.")
          for field in ("attempted_pairs","distinct_pairs","pairs_with_technical_previews",
                        "pairs_blocked_or_failed","total_real_mp3_previews",
                        "different_song_pairs_attempted","different_song_pairs_with_previews",
                        "same_song_versions_with_previews"):
              print(field,":",report.get(field))
          print("mp3_in_private_archive:",actual_mp3)
          for genre, row in sorted(report["by_genre"].items()):
              print("genre:",genre,"attempted:",row["attempted"],
                    "accepted_pairs:",row["technical_pass_pairs"],
                    "previews:",row["mp3_count"])
          for pair in report["pair_attempts"]:
              previews=pair["technical_previews"]
              bars=sorted(x["bars"] for x in previews)
              statuses=[x.get("postrender_phase_audit",{}).get("status","unreported") for x in previews]
              print("seed:",pair["seed"],"genre:",pair["genre"],"QC_previews_bars:",bars,
                    "postrender_confidence_statuses:",statuses,
                    "attempt_status:",pair["status"])
          print("All RC37 previews remain unverified by listener.")
          PY

      - name: RC37 rejection categories and guard measurements, no source identifiers
        run: |
          python - <<'PY'
          import json, tarfile, pathlib, collections
          p=pathlib.Path("input/djbrain-rc37-private-38954223934.tar.gz")
          with tarfile.open(p,"r:gz") as tar:
              raw=tar.extractfile(next(x for x in tar.getmembers() if x.name.lstrip("./")=="RC37_RESULTS.json"))
              report=json.load(raw)
          def category(message):
              m=message.lower()
              if "entry_beat_qc_failed:" in m:
                  if "uncertain_single_beat_attack" in m: return "entry_uncertain_single_attack"
                  if "missing_entry_kick_energy" in m: return "entry_weak_kick"
                  if "entry_beats_misaligned" in m: return "entry_kick_misaligned"
                  return "entry_guard_uncertain"
              if "full overlap rhythm" in m:
                  if "kick_phase_mismatch" in m: return "five_window_phase_mismatch"
                  if "kick_phase_changes_during_overlap" in m: return "five_window_signed_drift"
                  if "uncertain_kick_onset" in m: return "five_window_uncertain"
                  return "full_overlap_other"
              if "kick attack alignment" in m:
                  return "legacy_kick_guard_rejection"
              if "attack phase changes" in m: return "attack_phase_drift"
              if "weak low-frequency" in m: return "weak_lowband_attack"
              if "unstable tempo" in m: return "unstable_tempo"
              if "source stretching" in m: return "tempo_stretch_over_limit"
              if "not enough audio" in m or "too little audio" in m: return "insufficient_audio"
              if "no pulse candidate" in m: return "no_pulse_candidate"
              if "outside genre" in m: return "genre_tempo_mismatch"
              if "pinned message" in m or "pinned source" in m: return "pinned_source_unavailable"
              if not m.strip(): return "empty"
              return "other_error"
          print("SAFE RC37 rejection causes (no source names, IDs or details)")
          tally=collections.Counter()
          for row in report["pair_attempts"]:
              categories=[category(x) for x in (row.get("blocked") or [])]
              categories += [category(x) for x in (row.get("analysis_errors") or [])]
              if row.get("error"): categories.append(category(row["error"]))
              for k in categories: tally[k]+=1
              qc=[]
              for clip in row["technical_previews"]:
                  full=clip.get("full_overlap_qc",{})
                  entry=full.get("entry_beat_qc",{})
                  qc.append({"bars":clip["bars"],
                             "full_max_ms":full.get("max_window_offset_ms"),
                             "signed_drift_ms":full.get("max_signed_drift_ms"),
                             "first4_max_ms":entry.get("max_entry_offset_ms")})
              print("seed",row["seed"],"genre",row["genre"],
                    "blocked_causes",categories,"accepted_QC",qc)
          print("failure_categories_total",dict(tally))
          PY

      - name: Publish two RC37 review previews to same PRIVATE draft release
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import tarfile
          p=Path("input/djbrain-rc37-private-38954223934.tar.gz")
          expected={
            "seed_36/RC33_melodic_techno_16bars_UNVERIFIED.mp3":"RC37_seed36_melodic_16bars_UNVERIFIED.mp3",
            "seed_37/RC33_melodic_techno_8bars_UNVERIFIED.mp3":"RC37_seed37_melodic_8bars_UNVERIFIED.mp3",
          }
          output=Path("private-preview");output.mkdir(exist_ok=True)
          with tarfile.open(p,"r:gz") as archive:
              selected={}
              for m in archive.getmembers():
                  name=m.name.lstrip("./")
                  if name in expected:
                      if name in selected: raise SystemExit("Duplicate preview")
                      if not m.isfile() or m.size<10_000 or m.size>30_000_000:
                          raise SystemExit("Invalid MP3 preview")
                      selected[name]=m
              if set(selected)!=set(expected):
                  raise SystemExit("Expected exactly two RC37 technical previews")
              for name,asset in expected.items():
                  with archive.extractfile(selected[name]) as src:
                      (output/asset).write_bytes(src.read())
          print("Two RC37 MP3 previews extracted for PRIVATE draft release.")
          PY
          gh release upload "djbrain-rc37-private-38954223934" private-preview/*.mp3 \
            --repo volkovitskiyartem-lab/void-vibe-router --clobber >/dev/null
          echo "Two MP3s added to PRIVATE draft release; no PUBLIC artifact was created."
