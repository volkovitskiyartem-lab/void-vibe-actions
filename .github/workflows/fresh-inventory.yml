name: Fresh Electronic Music inventory (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fresh-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: void-vibe-fresh-inventory-only
  cancel-in-progress: false
jobs:
  inventory:
    if: github.ref == 'refs/heads/main' && vars.PUBLIC_RUNNER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ROUTER_STATE_DIR: ${{ github.workspace }}/progress/data
      FRESH_INVENTORY_OUTPUT: ${{ github.workspace }}/audit/reports/fresh_electronic_music_inventory.json
    steps:
      - name: Checkout private code
        uses: actions/checkout@v4
        with:
          repository: volkovitskiyartem-lab/void-vibe-router
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: app
      - name: Mount immutable source-of-truth and private report branch
        working-directory: app
        run: |
          set -euo pipefail
          git config user.name 'music-router'
          git config user.email 'music-router@users.noreply.github.com'
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git worktree add ../progress --detach origin/router-state
          if git show-ref --verify --quiet refs/remotes/origin/coverage-reports; then
            git worktree add ../audit -B coverage-reports origin/coverage-reports
          else
            git worktree add --detach ../audit
            cd ../audit
            git checkout --orphan coverage-reports
            git rm -rf .
            mkdir -p reports
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Telegram metadata client
        working-directory: app
        run: python -m pip install -r requirements.txt
      - name: Inventory source messages without downloading audio or sending to Telegram
        working-directory: app
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python -u fresh_music_inventory.py
      - name: Store inventory in private report branch only
        working-directory: audit
        run: |
          set -euo pipefail
          test -s reports/fresh_electronic_music_inventory.json
          test -s reports/fresh_electronic_music_items.json
          git add reports/fresh_electronic_music_inventory.json reports/fresh_electronic_music_items.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save Fresh Electronic Music inventory'
            git push origin HEAD:coverage-reports
          fi
          echo 'Read-only source inventory completed. Live importer remains unchanged.'
