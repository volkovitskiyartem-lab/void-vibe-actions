name: VOID VIBE exact copy-only forum consolidation
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview, copy approved pairs, recheck holds, or run the approved bounded manual trial
        type: choice
        options: [preview, apply, reconcile_holds, trial]
        default: preview
        required: true
      chain_step:
        description: Internal bounded continuation counter; leave at zero for a manual start
        type: number
        required: false
        default: 0
      hold_digest:
        description: Exact private hold-set SHA256, required only for never-sent candidate recheck
        type: string
        required: false
        default: ''
  schedule:
    - cron: '9,24,39,54 * * * *'
  pull_request:
    paths:
      - '.github/workflows/forum-mass-copy.yml'
      - 'tests/test_forum_mass_runner.py'
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('void-vibe-forum-mass-review-{0}', github.event.pull_request.number) || 'void-vibe-forum-mass-runner' }}
  cancel-in-progress: false
jobs:
  offline_review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s tests -q
  admission:
    # Evaluate the finite priority lease BEFORE joining the shared transfer lock.
    if: github.repository == 'volkovitskiyartem-lab/void-vibe-actions' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLIC_RUNNER_ENABLED == 'true' && vars.ROUTER_PAUSED != 'true' && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'trial' && vars.MUSIC_TRANSFER_PAUSED == 'true' && vars.FORUM_MASS_ENABLED == 'false') || (inputs.mode != 'trial' && vars.MUSIC_TRANSFER_PAUSED != 'true' && (inputs.mode == 'preview' || inputs.mode == 'reconcile_holds' || vars.FORUM_MASS_ENABLED == 'true')) || (vars.MUSIC_TRANSFER_PAUSED == 'true' && vars.FORUM_MASS_ENABLED == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.window.outputs.due }}
    env:
      RUN_MODE: ${{ inputs.mode == 'trial' && 'apply' || inputs.mode || 'apply' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: volkovitskiyartem-lab/void-vibe-router
          ref: 268890567f41ff74c7c1d2b58ccbd8fffe61491a
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check timed admission without Telegram credentials
        id: window
        working-directory: app
        run: python forum_transfer_priority.py
  bounded_copy:
    needs: admission
    concurrency:
      group: music-router
      cancel-in-progress: false
    if: needs.admission.outputs.due == 'true' && github.repository == 'volkovitskiyartem-lab/void-vibe-actions' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLIC_RUNNER_ENABLED == 'true' && vars.ROUTER_PAUSED != 'true' && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'trial' && vars.MUSIC_TRANSFER_PAUSED == 'true' && vars.FORUM_MASS_ENABLED == 'false') || (inputs.mode != 'trial' && vars.MUSIC_TRANSFER_PAUSED != 'true' && (inputs.mode == 'preview' || inputs.mode == 'reconcile_holds' || vars.FORUM_MASS_ENABLED == 'true')) || (vars.MUSIC_TRANSFER_PAUSED == 'true' && vars.FORUM_MASS_ENABLED == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'))))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      continue_copy: ${{ steps.copy.outputs.continue_copy }}
    env:
      FORUM_COMPACT_ROUTING: 'true'
      ROUTER_STATE_DIR: ${{ github.workspace }}/progress/data
      RUN_MODE: ${{ inputs.mode == 'trial' && 'apply' || inputs.mode || 'apply' }}
    steps:
      - name: Checkout reviewed immutable PRIVATE mass engine
        uses: actions/checkout@v4
        with:
          repository: volkovitskiyartem-lab/void-vibe-router
          ref: 268890567f41ff74c7c1d2b58ccbd8fffe61491a
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          path: app
      - name: Checkout immutable PRIVATE approved inventory candidate
        uses: actions/checkout@v4
        with:
          repository: volkovitskiyartem-lab/void-vibe-router
          ref: 16cfb275343e0d0ac4e80c1265d0502971ac3e82
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          path: inventory
      - name: Checkout existing PRIVATE transfer state
        uses: actions/checkout@v4
        with:
          repository: volkovitskiyartem-lab/void-vibe-router
          ref: router-state
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          path: progress
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned private dependencies
        working-directory: app
        run: python -m pip install -r requirements.txt
      - name: Preview exact scope without Telegram credentials or state writes
        if: env.RUN_MODE == 'preview'
        working-directory: app
        run: |
          python telegram_forum_mass_runner.py preview \
            --plan ../inventory/data/forum-refresh/proposed-plan.json \
            --state-root ../progress \
            --pilot-receipts ../progress/data/forum-pilot-receipts.json
      - name: Configure private durable state authentication
        if: env.RUN_MODE == 'apply' || env.RUN_MODE == 'reconcile_holds'
        working-directory: progress
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name 'void-vibe-forum-mass'
          git config user.email 'void-vibe-forum-mass@users.noreply.github.com'
      - name: Apply bounded verified pairs with private receipt pushes
        id: copy
        if: env.RUN_MODE == 'apply' || env.RUN_MODE == 'reconcile_holds'
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          FORUM_MASS_SERIALIZED: 'true'
          FORUM_MASS_TRIAL: ${{ inputs.mode == 'trial' && 'true' || 'false' }}
          FORUM_MASS_ENABLED: ${{ vars.FORUM_MASS_ENABLED }}
          ROUTER_PAUSED: ${{ vars.ROUTER_PAUSED }}
          MUSIC_TRANSFER_PAUSED: ${{ vars.MUSIC_TRANSFER_PAUSED }}
          APPROVED_HOLDS: ${{ inputs.hold_digest }}
        run: |
          set -euo pipefail
          report=$(mktemp)
          trap 'rm -f "$report"' EXIT
          python telegram_forum_mass_runner.py "$RUN_MODE" \
            --plan ../inventory/data/forum-refresh/proposed-plan.json \
            --state-root ../progress \
            --pilot-receipts ../progress/data/forum-pilot-receipts.json \
            --approved-plan 58753025f57470190130a1469b4038d0fa77a78642788725e1edcc3633242149 \
            --approved-holds "$APPROVED_HOLDS" | tee "$report"
          python - "$report" <<'PYTHON'
          import os, re, sys
          values = {}
          for line in open(sys.argv[1], encoding="utf-8"):
              m = re.fullmatch(r"FORUM_MASS_([A-Z_]+)=([a-z0-9_]+)", line.strip())
              if m:
                  values[m[1]] = m[2]
          def count(key):
              value = values.get(key, "")
              return int(value) if value.isdecimal() else -1
          due = (os.environ["RUN_MODE"] == "apply"
                 and os.environ["FORUM_MASS_TRIAL"] == "false"
                 and count("SENT") > 0
                 and count("PENDING_TOTAL") == 0
                 and count("REMAINING") > 0
                 and count("DAILY_REMAINING") > 0
                 and values.get("DEFERRED") == "none")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"continue_copy={str(due).lower()}\n")
          PYTHON
  continue_copy:
    # This job receives no Telegram or private-repository credentials.
    # Only a completed durable checkpoint with positive progress can continue.
    needs: bounded_copy
    if: needs.bounded_copy.result == 'success' && needs.bounded_copy.outputs.continue_copy == 'true' && github.repository == 'volkovitskiyartem-lab/void-vibe-actions' && github.ref == 'refs/heads/main' && vars.PUBLIC_RUNNER_ENABLED == 'true' && vars.ROUTER_PAUSED != 'true' && vars.FORUM_MASS_ENABLED == 'true' && vars.MUSIC_TRANSFER_PAUSED == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'))
    permissions:
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Queue one bounded continuation
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN_STEP: ${{ inputs.chain_step || 0 }}
        run: |
          set -euo pipefail
          [[ "$CHAIN_STEP" =~ ^(0|[1-9][0-9]?)$ ]] || exit 1
          if (( CHAIN_STEP >= 24 )); then
            echo "Bounded continuation limit reached; scheduled entry remains available"
            exit 0
          fi
          gh workflow run forum-mass-copy.yml -R "$GITHUB_REPOSITORY" --ref main -f mode=apply -f chain_step="$((CHAIN_STEP+1))"
    # Every continuation re-enters unchanged timed admission, shared lock,
    # private journal validation and daily quota. Failures never chain.
