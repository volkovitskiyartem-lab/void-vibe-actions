name: Fresh Electronic Music accelerated historical archive
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fresh-bulk.yml']
  # Hourly watchdog restarts after missed self-dispatches or protected windows.
  # All crons are UTC; 08:58, 12:58, 16:58 UTC = 11:58, 15:58, 19:58 MSK.
  # Bounded chain still runs immediately after saved progress between windows.
  schedule:
    - cron: '7 * * * *'
    - cron: '58 8,12,16 * * *'
  # Independent event fallback: GitHub scheduled cron can be delayed or skipped.
  # Restart archive when our regular publication or editorial workflow finishes,
  # waiting until the protected daily music window has closed.
  workflow_run:
    workflows:
      - VOID VIBE daily collect and drip publishing
      - Daily track editorial
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: bulk
        options: [plan, pilot, bulk]
permissions:
  contents: read
  actions: write
concurrency:
  group: void-vibe-fresh-archive
  cancel-in-progress: false
jobs:
  process:
    concurrency:
      group: music-router
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) && vars.PUBLIC_RUNNER_ENABLED == 'true' && vars.ROUTER_PAUSED != 'true' && vars.MUSIC_TRANSFER_PAUSED != 'true' && vars.FRESH_BULK_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ROUTER_STATE_DIR: ${{ github.workspace }}/progress/data
      FRESH_INVENTORY_PATH: ${{ github.workspace }}/inventory/reports/fresh_electronic_music_items.json
      FRESH_MODE: ${{ inputs.mode || 'bulk' }}
      IMPORT_RECEIPTS: 'true'
      ARCHIVE_RETENTION_CHECKS: 'true'
      MAX_SENDS_PER_SOURCE: '40'
    steps:
      - name: Yield protected daily window immediately rather than occupying runner
        if: github.event_name == 'workflow_run'
        run: |
          # fresh_bulk.allow_now() is the authoritative publication-window gate.
          # Do not sleep here: 47+ minutes of waiting consume the 55-minute
          # job timeout, cancelling a subsequent batch after audio sends.
          echo 'Archive triggered; importer will defer any protected daily window.'
      - name: Checkout private music router
        uses: actions/checkout@v4
        with:
          repository: volkovitskiyartem-lab/void-vibe-router
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: app
      - name: Load existing state and immutable inventory
        working-directory: app
        run: |
          set -euo pipefail
          git config user.name 'music-router'
          git config user.email 'music-router@users.noreply.github.com'
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git worktree add ../progress -B router-state origin/router-state
          git worktree add ../inventory --detach origin/coverage-reports
          test -s ../inventory/reports/fresh_electronic_music_items.json
          test -s ../progress/data/router.sqlite3
          test ! -e ../progress/data/IN_PROGRESS
          test ! -e ../progress/data/FRESH_BULK_IN_PROGRESS.json
          test ! -e ../progress/data/MAINTENANCE_IN_PROGRESS.json
          test ! -e ../progress/data/PAIRING_IN_PROGRESS.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and validate isolated importer
        working-directory: app
        env:
          ROUTER_STATE_DIR: ${{ runner.temp }}/fresh-bulk-tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest -v test_fresh_bulk test_fresh_bulk_context test_fresh_bulk_continue test_fresh_daily
      - name: Persist recovery marker before any sends
        if: env.FRESH_MODE != 'plan'
        working-directory: progress
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          Path('data/FRESH_BULK_IN_PROGRESS.json').write_text(
            json.dumps({'run_id':os.environ['GITHUB_RUN_ID'], 'mode':os.environ['FRESH_MODE']})
          )
          PY
          git add data/FRESH_BULK_IN_PROGRESS.json
          git commit -m 'Start bounded Fresh Music transfer with recovery marker'
          git push origin HEAD:router-state
      - name: Prepare inventory or send strictly bounded tracks
        id: fresh
        working-directory: app
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python -u fresh_bulk.py
      - name: Persist results and durable receipts even on error
        if: always() && steps.fresh.outcome != '' && steps.fresh.outcome != 'skipped'
        working-directory: progress
        env:
          FRESH_RESULT: ${{ steps.fresh.outcome }}
        run: |
          set -euo pipefail
          if [ "$FRESH_RESULT" = success ]; then rm -f data/FRESH_BULK_IN_PROGRESS.json; fi
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          p=Path('data/router.sqlite3')
          if p.exists():
              with sqlite3.connect(p) as db:
                  assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
                  db.execute('PRAGMA wal_checkpoint(TRUNCATE)')
          PY
          for f in router.sqlite3 fresh_bulk_summary.json import_receipts.json genre_review.json FRESH_BULK_IN_PROGRESS.json; do
            if test -f "data/$f" || git ls-files --error-unmatch "data/$f" >/dev/null 2>&1; then
              git add -A -- "data/$f"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Save Fresh Music archive progress and verified receipts'
            # GitHub can transiently reject commit_refs after the Telegram
            # sends have already succeeded. Retry the SAME immutable commit.
            # Never re-send audio and never force-push the receipt branch.
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:router-state; then
                pushed=true
                echo "FRESH_BULK_STATE_COMMITTED attempt=$attempt"
                break
              fi
              echo "Fresh receipt state push rejected (attempt $attempt of 5); retrying the exact same commit"
              if [ "$attempt" -lt 5 ]; then sleep $((attempt * 15)); fi
            done
            if [ "$pushed" != true ]; then
              echo "Fresh receipts could not be durably committed; stop and retain remote recovery marker"
              exit 1
            fi
          fi
      - name: Dispatch next bulk batch only after durable progress is committed
        if: success() && env.FRESH_MODE == 'bulk' && steps.fresh.outcome == 'success'
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTER_PAUSED: ${{ vars.ROUTER_PAUSED }}
          MUSIC_TRANSFER_PAUSED: ${{ vars.MUSIC_TRANSFER_PAUSED }}
          FRESH_BULK_PAUSED: ${{ vars.FRESH_BULK_PAUSED }}
        run: python fresh_bulk_continue.py
      - name: Trigger bounded pilot after durable inventory plan
        if: success() && env.FRESH_MODE == 'plan'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fresh-bulk.yml --repo volkovitskiyartem-lab/void-vibe-actions --ref main -f mode=pilot
