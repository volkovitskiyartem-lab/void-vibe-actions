name: Verify Fresh Music interrupted 25-track batch (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-fresh-night-25.yml']
permissions:
  contents: read
jobs:
  audit:
    concurrency:
      group: music-router
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROUTER_STATE_DIR: ${{ github.workspace }}/progress/data
    steps:
      - name: Checkout private music router
        uses: actions/checkout@v4
        with:
          repository: volkovitskiyartem-lab/void-vibe-router
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: app
      - name: Load saved progress read-only
        working-directory: app
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/router-state:refs/remotes/origin/router-state'
          git worktree add --detach ../progress origin/router-state
          test -s ../progress/data/router.sqlite3
          test -s ../progress/data/import_receipts.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
        working-directory: app
      - name: Audit live Telegram audio and saved receipts without sending
        working-directory: app
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python -u audit_fresh_night_38983780275.py
