name: VOID VIBE read-only forum checkpoint

on:
  pull_request:
    paths:
      - '.github/workflows/forum-readonly-count.yml'
      - 'tests/test_forum_inventory_guard.py'
  workflow_dispatch:
  schedule:
    - cron: '12 * * * *'
  workflow_run:
    workflows:
      - Fresh Electronic Music accelerated historical archive
      - VOID VIBE daily collect and drip publishing
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['.github/workflows/forum-readonly-count.yml']

permissions:
  contents: read
  actions: read

# Never overlap live music publishing or another forum inventory.
concurrency:
  group: void-vibe-music-transfer
  cancel-in-progress: false

jobs:
  offline_guard_tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test real guard code with fake state and fake GitHub runs (no secrets)
        run: python -m unittest discover -s tests -p 'test_forum_inventory_guard.py' -v

  checkpoint:
    if: github.repository == 'volkovitskiyartem-lab/void-vibe-actions' && github.ref == 'refs/heads/main' && vars.ROUTER_PAUSED != 'true' && vars.MUSIC_TRANSFER_PAUSED != 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout audited private reader at immutable commit
        uses: actions/checkout@v4
        with:
          repository: volkovitskiyartem-lab/void-vibe-router
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: 6e374dfaf249197921fdc77f5015a07e113d0c36
          path: app
          persist-credentials: false
      - name: Checkout private audit state (never uploaded or logged)
        uses: actions/checkout@v4
        with:
          repository: volkovitskiyartem-lab/void-vibe-router
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: state/telegram-forum-inventory
          path: audit-state
          persist-credentials: false
      - name: Stop after completion or during Telegram cooldown
        id: gate
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          file = Path('audit-state/data/forum-audit/checkpoint.json')
          state = json.loads(file.read_text()) if file.exists() else None
          if state is not None:
              if state.get('schema') != 1 or type(state.get('complete')) is not bool:
                  raise SystemExit('Invalid private checkpoint')
              if state.get('error') not in (None, 'FloodWaitError'):
                  raise SystemExit('Unresolved private checkpoint error')
          until = state.get('blocked_until') if state else None
          cooldown = bool(until and datetime.fromisoformat(until) > datetime.now(timezone.utc))
          complete = bool(state and state['complete'])
          scan = not complete and not cooldown
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('scan=' + str(scan).lower() + '\n')
          print('FORUM_SCAN_GATE=' + ('complete' if complete else 'cooldown' if cooldown else 'ready'))
          PY
      - name: Guard inventory against recent progress and concurrent runs
        id: fallback_gate
        if: steps.gate.outputs.scan == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          def utc_time(value):
              dt = datetime.fromisoformat(value.replace('Z', '+00:00'))
              if dt.tzinfo is None:
                  raise ValueError('Inventory timestamp must be timezone aware')
              return dt.astimezone(timezone.utc)

          status_path = Path('audit-state/data/forum-audit/status.json')
          if not status_path.exists():
              raise SystemExit('Missing private aggregate checkpoint; refusing to scan')
          state = json.loads(status_path.read_text())
          if (state.get('schema') != 1 or type(state.get('complete')) is not bool or
                  type(state.get('scanned')) is not int or state['scanned'] < 0):
              raise SystemExit('Invalid aggregate checkpoint; refusing to scan')
          if state.get('error') is not None:
              raise SystemExit('Inventory error requires investigation')
          now = datetime.now(timezone.utc)
          updated = utc_time(state['updated_at'])
          if updated > now + timedelta(minutes=2):
              raise SystemExit('Future checkpoint timestamp; refusing to scan')

          reason = 'eligible'
          allow = True
          if state['complete']:
              allow, reason = False, 'complete'
          elif state.get('blocked_until') and utc_time(state['blocked_until']) > now:
              allow, reason = False, 'telegram_cooldown'
          elif (os.environ['EVENT_NAME'] != 'workflow_dispatch' and
                now - updated < timedelta(minutes=25)):
              # The persisted checkpoint, NOT any green but skipped workflow,
              # is the only clock that throttles automated inventory scans.
              allow, reason = False, 'recent_checkpoint'
          else:
              runs = json.loads(subprocess.check_output(
                  ['gh', 'api',
                   'repos/volkovitskiyartem-lab/void-vibe-actions/actions/workflows/forum-readonly-count.yml/runs?per_page=40'],
                  text=True))['workflow_runs']
              others = [r for r in runs if str(r['id']) != os.environ['RUN_ID']]
              active = {'queued', 'in_progress', 'pending', 'waiting', 'requested'}
              if any(r.get('status') in active for r in others):
                  allow, reason = False, 'other_inventory_active'
              elif any(r.get('conclusion') in ('failure', 'cancelled', 'timed_out') and
                       utc_time(r['created_at']) > updated for r in others):
                  raise SystemExit('Unresolved failed inventory since last checkpoint')
              else:
                  reason = 'eligible'

          print('FORUM_FALLBACK=' + reason)
          print('FORUM_SCAN_ENABLED=' + str(allow).lower())
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('scan=' + str(allow).lower() + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('Read-only forum inventory: **' + reason +
                            '**; Telegram scan: **' +
                            ('enabled' if allow else 'skipped') + '**\n')
          PY
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.scan == 'true' && steps.fallback_gate.outputs.scan == 'true'
        with:
          python-version: '3.12'
      - name: Install pinned Telegram client
        if: steps.gate.outputs.scan == 'true' && steps.fallback_gate.outputs.scan == 'true'
        working-directory: app
        run: python -m pip install -r requirements.txt
      - name: Scan in five bounded pages and durably checkpoint each page
        if: steps.gate.outputs.scan == 'true' && steps.fallback_gate.outputs.scan == 'true'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          ROUTER_PAUSED: ${{ vars.ROUTER_PAUSED }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p audit-state/data/forum-audit
          git -C audit-state config user.name 'void-vibe-audit'
          git -C audit-state config user.email 'void-vibe-audit@users.noreply.github.com'
          gh auth setup-git
          for page in 1 2 3 4 5; do
            python app/telegram_forum_checkpoint.py \
              --input audit-state/data/forum-audit/checkpoint.json \
              --output "$RUNNER_TEMP/forum-page-$page.json" --limit 300
            install -m 600 "$RUNNER_TEMP/forum-page-$page.json" audit-state/data/forum-audit/checkpoint.json
            python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          sys.path.insert(0, str(Path('app').resolve()))
          from telegram_forum_checkpoint import private_summary
          data = json.loads(Path('audit-state/data/forum-audit/checkpoint.json').read_text())
          status = {'schema': 1, 'updated_at': datetime.now(timezone.utc).isoformat(),
                    **private_summary(data)}
          path = Path('audit-state/data/forum-audit/status.json')
          path.write_text(json.dumps(status, sort_keys=True) + '\n', encoding='utf-8')
          os.chmod(path, 0o600)
          print('PRIVATE_FORUM_PROGRESS=' + json.dumps(status, sort_keys=True))
          PY
            git -C audit-state add -f -- data/forum-audit/checkpoint.json data/forum-audit/status.json
            if ! git -C audit-state diff --cached --quiet; then
              git -C audit-state commit -q -m 'Persist bounded read-only forum scan'
              git -C audit-state push --quiet origin HEAD:refs/heads/state/telegram-forum-inventory
            fi
            stage="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('audit-state/data/forum-audit/checkpoint.json').read_text())
          if data['complete']:
              print('complete')
          elif data.get('error') or data.get('blocked_until'):
              print('blocked')
          else:
              print('ready')
          PY
            )"
            if test "$stage" != 'ready'; then
              echo "FORUM_SCAN_STOP=$stage"
              break
            fi
            if test "$page" -lt 5; then sleep 45; fi
          done
          echo 'PRIVATE_FORUM_CHECKPOINT_SAVED=true'
