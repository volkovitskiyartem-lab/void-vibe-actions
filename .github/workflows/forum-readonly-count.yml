name: VOID VIBE read-only forum checkpoint

on:
  workflow_dispatch:
  schedule:
    - cron: '12 * * * *'

permissions:
  contents: read

# Never overlap live music publishing or another forum inventory.
concurrency:
  group: void-vibe-music-transfer
  cancel-in-progress: false

jobs:
  checkpoint:
    if: github.repository == 'volkovitskiyartem-lab/void-vibe-actions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout audited private reader at immutable commit
        uses: actions/checkout@v4
        with:
          repository: volkovitskiyartem-lab/void-vibe-router
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: 6e374dfaf249197921fdc77f5015a07e113d0c36
          path: app
          persist-credentials: false
      - name: Checkout private audit state (never uploaded or logged)
        uses: actions/checkout@v4
        with:
          repository: volkovitskiyartem-lab/void-vibe-router
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: state/telegram-forum-inventory
          path: audit-state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Telegram client
        working-directory: app
        run: python -m pip install -r requirements.txt
      - name: Scan at most 300 messages, never send or download media
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          ROUTER_PAUSED: ${{ vars.ROUTER_PAUSED }}
        run: |
          python app/telegram_forum_checkpoint.py \
            --input audit-state/data/forum-audit/checkpoint.json \
            --output "$RUNNER_TEMP/forum-next.json" --limit 300
      - name: Save cursor and metadata ONLY in private audit branch
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/forum-next.json"
          mkdir -p audit-state/data/forum-audit
          install -m 600 "$RUNNER_TEMP/forum-next.json" audit-state/data/forum-audit/checkpoint.json
          cd audit-state
          git config user.name 'void-vibe-audit'
          git config user.email 'void-vibe-audit@users.noreply.github.com'
          git add -f -- data/forum-audit/checkpoint.json
          if ! git diff --cached --quiet; then
            git commit -q -m 'Save read-only forum inventory checkpoint'
            gh auth setup-git
            git push --quiet origin HEAD:refs/heads/state/telegram-forum-inventory
          fi
          echo 'PRIVATE_FORUM_CHECKPOINT_SAVED=true'
