name: VOID VIBE read-only forum checkpoint

on:
  workflow_dispatch:
  schedule:
    - cron: '12 * * * *'
  workflow_run:
    workflows:
      - Fresh Electronic Music accelerated historical archive
      - VOID VIBE daily collect and drip publishing
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['.github/workflows/forum-readonly-count.yml']

permissions:
  contents: read
  actions: read

# Never overlap live music publishing or another forum inventory.
concurrency:
  group: void-vibe-music-transfer
  cancel-in-progress: false

jobs:
  checkpoint:
    if: github.repository == 'volkovitskiyartem-lab/void-vibe-actions' && github.ref == 'refs/heads/main' && vars.ROUTER_PAUSED != 'true' && vars.MUSIC_TRANSFER_PAUSED != 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout audited private reader at immutable commit
        uses: actions/checkout@v4
        with:
          repository: volkovitskiyartem-lab/void-vibe-router
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: 6e374dfaf249197921fdc77f5015a07e113d0c36
          path: app
          persist-credentials: false
      - name: Checkout private audit state (never uploaded or logged)
        uses: actions/checkout@v4
        with:
          repository: volkovitskiyartem-lab/void-vibe-router
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: state/telegram-forum-inventory
          path: audit-state
          persist-credentials: false
      - name: Stop after completion or during Telegram cooldown
        id: gate
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          file = Path('audit-state/data/forum-audit/checkpoint.json')
          state = json.loads(file.read_text()) if file.exists() else None
          if state is not None:
              if state.get('schema') != 1 or type(state.get('complete')) is not bool:
                  raise SystemExit('Invalid private checkpoint')
              if state.get('error') not in (None, 'FloodWaitError'):
                  raise SystemExit('Unresolved private checkpoint error')
          until = state.get('blocked_until') if state else None
          cooldown = bool(until and datetime.fromisoformat(until) > datetime.now(timezone.utc))
          complete = bool(state and state['complete'])
          scan = not complete and not cooldown
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('scan=' + str(scan).lower() + '\n')
          print('FORUM_SCAN_GATE=' + ('complete' if complete else 'cooldown' if cooldown else 'ready'))
          PY
      - name: Skip duplicate or too-recent fallback scan
        id: fallback_gate
        if: steps.gate.outputs.scan == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          should_scan = True
          if os.environ['EVENT_NAME'] == 'workflow_run':
              path = Path('audit-state/data/forum-audit/status.json')
              if not path.exists():
                  raise SystemExit('Missing private aggregate status: fallback refuses to scan')
              state = json.loads(path.read_text())
              timestamp = datetime.fromisoformat(state['updated_at'].replace('Z', '+00:00'))
              if timestamp.tzinfo is None:
                  raise SystemExit('Invalid checkpoint timestamp')
              now = datetime.now(timezone.utc)
              if state.get('schema') != 1 or state.get('complete') is not False:
                  raise SystemExit('Unexpected aggregate checkpoint state')
              if timestamp > now + timedelta(minutes=2):
                  raise SystemExit('Future checkpoint timestamp')
              if now - timestamp < timedelta(minutes=75):
                  should_scan = False
                  print('FORUM_FALLBACK=recent_checkpoint')
              else:
                  run_list = json.loads(subprocess.check_output(
                      ['gh', 'api', 'repos/volkovitskiyartem-lab/void-vibe-actions/actions/workflows/forum-readonly-count.yml/runs?per_page=30'], text=True))
                  others = [r for r in run_list['workflow_runs'] if str(r['id']) != os.environ['RUN_ID']]
                  busy = {'queued', 'in_progress', 'pending', 'waiting', 'requested'}
                  if any(r.get('status') in busy for r in others):
                      should_scan = False
                      print('FORUM_FALLBACK=other_inventory_active')
                  elif any(now - datetime.fromisoformat(r['created_at'].replace('Z', '+00:00')) < timedelta(minutes=65) for r in others):
                      should_scan = False
                      print('FORUM_FALLBACK=recently_triggered')
                  elif others and others[0].get('conclusion') in ('failure', 'cancelled', 'timed_out'):
                      should_scan = False
                      print('FORUM_FALLBACK=previous_failure')
                  else:
                      print('FORUM_FALLBACK=eligible')
          else:
              print('FORUM_FALLBACK=scheduled_or_manual')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('scan=' + str(should_scan).lower() + '\n')
          PY
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.scan == 'true' && steps.fallback_gate.outputs.scan == 'true'
        with:
          python-version: '3.12'
      - name: Install pinned Telegram client
        if: steps.gate.outputs.scan == 'true' && steps.fallback_gate.outputs.scan == 'true'
        working-directory: app
        run: python -m pip install -r requirements.txt
      - name: Scan in five bounded pages and durably checkpoint each page
        if: steps.gate.outputs.scan == 'true' && steps.fallback_gate.outputs.scan == 'true'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          ROUTER_PAUSED: ${{ vars.ROUTER_PAUSED }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p audit-state/data/forum-audit
          git -C audit-state config user.name 'void-vibe-audit'
          git -C audit-state config user.email 'void-vibe-audit@users.noreply.github.com'
          gh auth setup-git
          for page in 1 2 3 4 5; do
            python app/telegram_forum_checkpoint.py \
              --input audit-state/data/forum-audit/checkpoint.json \
              --output "$RUNNER_TEMP/forum-page-$page.json" --limit 300
            install -m 600 "$RUNNER_TEMP/forum-page-$page.json" audit-state/data/forum-audit/checkpoint.json
            python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          sys.path.insert(0, str(Path('app').resolve()))
          from telegram_forum_checkpoint import private_summary
          data = json.loads(Path('audit-state/data/forum-audit/checkpoint.json').read_text())
          status = {'schema': 1, 'updated_at': datetime.now(timezone.utc).isoformat(),
                    **private_summary(data)}
          path = Path('audit-state/data/forum-audit/status.json')
          path.write_text(json.dumps(status, sort_keys=True) + '\n', encoding='utf-8')
          os.chmod(path, 0o600)
          print('PRIVATE_FORUM_PROGRESS=' + json.dumps(status, sort_keys=True))
          PY
            git -C audit-state add -f -- data/forum-audit/checkpoint.json data/forum-audit/status.json
            if ! git -C audit-state diff --cached --quiet; then
              git -C audit-state commit -q -m 'Persist bounded read-only forum scan'
              git -C audit-state push --quiet origin HEAD:refs/heads/state/telegram-forum-inventory
            fi
            stage="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('audit-state/data/forum-audit/checkpoint.json').read_text())
          if data['complete']:
              print('complete')
          elif data.get('error') or data.get('blocked_until'):
              print('blocked')
          else:
              print('ready')
          PY
            )"
            if test "$stage" != 'ready'; then
              echo "FORUM_SCAN_STOP=$stage"
              break
            fi
            if test "$page" -lt 5; then sleep 45; fi
          done
          echo 'PRIVATE_FORUM_CHECKPOINT_SAVED=true'
