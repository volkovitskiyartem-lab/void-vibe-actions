name: VOID VIBE forum pilot — ten-pair PRIVATE preview (NO Telegram)

on:
  pull_request:
    paths:
      - '.github/workflows/forum-pilot-preview.yml'
      - 'scripts/forum_pilot_preview.py'
      - 'tests/test_forum_pilot_preview.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/forum-pilot-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-vibe-music-transfer
  cancel-in-progress: false

jobs:
  offline_pilot_tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate ten-pair pilot selection with synthetic data (NO Telegram)
        run: python -m unittest discover -s tests -p 'test_forum_pilot_preview.py' -v

  private_preview:
    if: github.repository == 'volkovitskiyartem-lab/void-vibe-actions' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ROUTER_PAUSED != 'true' && vars.MUSIC_TRANSFER_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout runner preview-only helper
        uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - name: Checkout reviewed PRIVATE planner at pinned commit
        uses: actions/checkout@v4
        with:
          repository: volkovitskiyartem-lab/void-vibe-router
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: 6e374dfaf249197921fdc77f5015a07e113d0c36
          path: app
          persist-credentials: false
      - name: Checkout PRIVATE completed inventory
        uses: actions/checkout@v4
        with:
          repository: volkovitskiyartem-lab/void-vibe-router
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: state/telegram-forum-inventory
          path: audit-state
          persist-credentials: false
      - name: Prepare immutable pilot preview with no Telegram credentials
        run: |
          python tooling/scripts/forum_pilot_preview.py \
            --private-reader app \
            --private-state audit-state \
            --output audit-state/data/forum-audit/pilot-ten-pair-preview.json
      - name: Persist pilot candidates to PRIVATE state branch only
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git -C audit-state config user.name 'void-vibe-audit'
          git -C audit-state config user.email 'void-vibe-audit@users.noreply.github.com'
          gh auth setup-git
          git -C audit-state add -f -- data/forum-audit/pilot-ten-pair-preview.json
          if ! git -C audit-state diff --cached --quiet; then
            git -C audit-state commit -q -m 'Record ten-pair private forum pilot candidates, NO Telegram operation'
            git -C audit-state push --quiet origin HEAD:refs/heads/state/telegram-forum-inventory
          fi
          echo 'PRIVATE_PILOT_PREVIEW_SAVED=true'
